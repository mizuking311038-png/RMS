<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ユニファイ並目限界ねじゲージ【UNC】 | 株式会社RMS</title>
    <style>
        body {
            margin: 0;
            padding: 40px 20px;
            font-family: sans-serif;
            background-color: #f9f9f9;
            color: #333;
        }

        .top-line {
            width: 100%;
            height: 50px;
            background-color: #e60012;
            display: flex;
            align-items: center;
            padding: 0 20px;
            box-sizing: border-box;
            position: fixed;
            top: 0;
            left: 0;
            z-index: 1000;
        }

        .top-line-text {
            color: #ffffff;
            font-size: 1.5rem;
            font-weight: bold;
            text-decoration: none;
        }

        /* ページ全体のスクロールを滑らかにする */
        html {
            scroll-behavior: smooth;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: #fff;
            padding: 30px;
            border-radius: 8px;
        }

        .back-link {
            display: inline-block;
            margin-bottom: 20px;
            color: #e60012;
            text-decoration: none;
            font-weight: bold;
        }

/* 一番下のお問い合わせエリア */
.contact-section {
    margin-top: 50px;
    padding: 30px 20px;
    background-color: #f7f8f9;    /* 薄いグレーの背景 */
    border-top: 3px solid #e60012; /* 上部に赤いアクセント線 */
    border-radius: 6px;
    text-align: center;
}

/* 「お問い合わせ」見出し */
.contact-title {
    font-size: 1.15rem;
    font-weight: bold;
    color: #333333;
    margin: 0 0 20px 0;
}

/* TELとEMAILの横並び枠 */
.contact-box {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 40px;                  /* TELとEMAILの間隔 */
    flex-wrap: wrap;            /* 画面が狭いときは自動改行 */
}

/* 各項目（TEL / EMAIL） */
.contact-item {
    font-size: 1.1rem;
    font-weight: bold;
    color: #333333;
}

/* FAX番号など（テキスト表示） */
.contact-val {
    color: #e60012;
}

.contact-label {
    color: #666666;
    font-size: 0.9rem;
    margin-right: 5px;
}

/* 電話番号・メールアドレスのリンク */
.contact-item a {
    color: #e60012;             /* 赤色文字 */
    text-decoration: none;
}

.contact-item a:hover {
    text-decoration: underline; /* カーソルを乗せた時に下線 */
}

    </style>
</head>

<body>

    <div class="top-line">
        <a href="../index.html" class="top-line-text">株式会社RMS</a>
    </div>

    <div class="container">
        <!-- ★「../」をつけることで、ひとつ上のフォルダにある index.html に戻れます -->
        <a href="../index.html" class="back-link">← トップページに戻る</a>
        <h1>ユニファイ並目限界ねじゲージ【UNC】</h1>
        <p>ブランド: 株式会社測範社(SHS)</p>

        <hr>

        <p></p>
    </div>

     <!-- ▼ 一番下のお問い合わせブロック ▼ -->
<div class="contact-section">
    <h3 class="contact-title">お気軽にお問い合わせ・ご相談ください</h3>
    
    <div class="contact-box">
        <!-- TEL（電話番号） -->
        <div class="contact-item">
            <span class="contact-label">TEL:</span>
            <a href="tel:090-1255-1962">090-1255-1962</a>
        </div>

<!-- FAX -->
        <div class="contact-item">
            <span class="contact-label">FAX:</span>
            <span class="contact-val">048-928-8028</span>
        </div>

        <!-- EMAIL（メールアドレス） -->
        <div class="contact-item">
            <span class="contact-label">E-MAIL:</span>
            <a href="mailto:ttk-city@rms-net.com">ttk-city@rms-net.com</a>
        </div>
    
</div>
</body>

</html>
